name: CI & Extension Build Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CLI Test Engine
        run: npm test

      - name: Run Extension Build
        run: node scripts/build-extension.js
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  node:
    uses: vannt-dev/repokeeper/.github/workflows/stack-node.yml@v0
    with:
      node-versions: '["22","24"]'
      os: '["ubuntu-latest"]'
      package-manager: npm
      install-command: npm ci
      cache: npm
      scripts: '["test"]'
