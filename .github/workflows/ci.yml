name: CI & Extension Build Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Extension Build
        run: node scripts/build-extension.js

      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls dist/extension-v*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@v0
        with:
          path: ${{ steps.zip.outputs.path }}
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  node:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: vannt-dev/repokeeper/.github/workflows/stack-node.yml@v0
    with:
      node-versions: '["22","24"]'
      os: '["ubuntu-latest"]'
      package-manager: npm
      install-command: npm ci
      cache: npm
      scripts: '["test"]'
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^([^/]*\.md|docs/.*|LICENSE)$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
