name: Automated GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to release again (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve Tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Build from the tag, not from the branch a manual run was started on
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check Versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          EXT=$(node -p "require('./extension/manifest.json').version")
          if [ "v$PKG" != "$TAG" ] || [ "v$EXT" != "$TAG" ]; then
            echo "::error::$TAG does not match package.json ($PKG) and extension/manifest.json ($EXT)"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Extension Artifacts
        run: npm run build:extension

      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls dist/extension-v*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@9e84b492001753fcc2c640c4b7b8ff4445bf0866 # v0.5.0
        with:
          path: ${{ steps.zip.outputs.path }}

      - name: Attest Extension Artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/extension-*.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 🎉 Release ${{ steps.tag.outputs.tag }}
          body: "Check the extension ZIP: `gh attestation verify <zip> --owner vannt-dev`"
          generate_release_notes: true
          draft: false
          prerelease: false
          # Re-running an older tag must not take "Latest" from a newer release
          make_latest: legacy
          overwrite_files: true
          files: |
            dist/extension-*.zip
            dist/extension-latest.zip

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      # Trusted publishing needs npm 11.5 or newer, which ships with Node 24
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; nothing to publish"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Install Dependencies
        if: env.SKIP != 'true'
        run: npm ci

      - name: Run Test Suite
        if: env.SKIP != 'true'
        run: npm test

      # npm signs in through trusted publishing (OIDC), so no token secret is needed
      - name: Publish
        if: env.SKIP != 'true'
        run: npm publish --provenance --access public
