name: Automated GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to release again (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve Tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Build from the tag, not from the branch a manual run was started on
      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          EXT=$(node -p "require('./extension/manifest.json').version")
          if [ "v$PKG" != "$TAG" ] || [ "v$EXT" != "$TAG" ]; then
            echo "::error::$TAG does not match package.json ($PKG) and extension/manifest.json ($EXT)"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Extension Artifacts
        run: npm run build:extension

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 🎉 Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          # Re-running an older tag must not take "Latest" from a newer release
          make_latest: legacy
          overwrite_files: true
          files: |
            dist/extension-*.zip
            dist/extension-latest.zip

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Trusted publishing needs npm 11.5 or newer, which ships with Node 24
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Check npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; nothing to publish"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Install Dependencies
        if: env.SKIP != 'true'
        run: npm ci

      - name: Run Test Suite
        if: env.SKIP != 'true'
        run: npm test

      # npm signs in through trusted publishing (OIDC), so no token secret is needed
      - name: Publish
        if: env.SKIP != 'true'
        run: npm publish --provenance --access public
