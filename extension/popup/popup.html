<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to PDF Converter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <span class="icon">📄</span>
        <span class="title">MD to PDF</span>
      </div>
      <span class="badge">v1.1.0</span>
    </header>

    <!-- Tabs Navigation -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">📁 File</button>
      <button class="tab-btn" data-tab="paste">📝 Paste</button>
      <button class="tab-btn" data-tab="page">🌐 Page</button>
      <button class="tab-btn" data-tab="history">📜 History</button>
    </div>

    <!-- Tab 1: Upload File -->
    <div class="tab-content active" id="tab-upload">
      <div class="drop-zone" id="drop-zone">
        <span class="drop-icon">📥</span>
        <p class="drop-text">Drag & drop <strong>.md</strong> file here</p>
        <span class="drop-sub">or click to browse</span>
        <input type="file" id="file-input" accept=".md,.markdown,.txt" multiple style="display:none">
      </div>
      <div class="file-info" id="file-info" style="display:none">
        <span class="file-name" id="file-name">filename.md</span>
        <button class="btn-clear" id="btn-clear-file">✕</button>
      </div>
    </div>

    <!-- Tab 2: Paste Raw Markdown -->
    <div class="tab-content" id="tab-paste">
      <textarea id="markdown-input" placeholder="Paste your Markdown content here... (Draft auto-saved)"></textarea>
      <span class="draft-status" id="draft-status">Draft saved</span>
    </div>

    <!-- Tab 3: Convert Current Web Page -->
    <div class="tab-content" id="tab-page">
      <div class="page-convert-card">
        <p>Extract raw Markdown from active tab or GitHub page:</p>
        <button class="btn-secondary" id="btn-grab-page">🔍 Grab Active Tab Content</button>
      </div>
    </div>

    <!-- Tab 4: Conversion History -->
    <div class="tab-content" id="tab-history">
      <div class="history-list" id="history-list">
        <p class="history-empty">No recent conversions found.</p>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="settings-grid">
      <div class="setting-item">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="modern" selected>Modern</option>
          <option value="dark">Dark Mode</option>
          <option value="academic">Academic</option>
          <option value="github">GitHub</option>
          <option value="ebook">E-Book (Lora)</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="minimal">Minimal</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="font-select">Font Family</label>
        <select id="font-select">
          <option value="Inter" selected>Inter (Default)</option>
          <option value="Roboto">Roboto</option>
          <option value="Lora">Lora (Serif)</option>
          <option value="Merriweather">Merriweather</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
          <option value="Fira Code">Fira Code</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="page-size">Paper Size</label>
        <select id="page-size">
          <option value="A4" selected>A4</option>
          <option value="Letter">Letter</option>
          <option value="A3">A3</option>
          <option value="Legal">Legal</option>
        </select>
      </div>
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" id="chk-toc" checked> Auto TOC</label>
      <label><input type="checkbox" id="chk-cover"> Cover Page</label>
      <label><input type="checkbox" id="chk-mermaid" checked> Mermaid</label>
      <label><input type="checkbox" id="chk-katex" checked> Math</label>
    </div>

    <!-- Advanced Custom CSS Drawer -->
    <details class="custom-css-drawer">
      <summary>🎨 Custom CSS Injection</summary>
      <textarea id="custom-css-input" placeholder="Enter custom CSS (e.g. h1 { color: #2563eb; })"></textarea>
    </details>

    <!-- Action Button -->
    <button class="btn-primary" id="btn-convert">
      <span>🚀 Preview & Export PDF</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
